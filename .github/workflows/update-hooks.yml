name: Update pre-commit hooks

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Bump hook pins
        run: |
          uv run prek update
          uv run python scripts/sync_hook_pins.py

      - name: Open or update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Hooks already current"
            exit 0
          fi
          branch="chore/update-pre-commit-hooks"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore: bump pre-commit hook pins"
          git push -f origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "chore: bump pre-commit hook pins" \
              --body "Automated \`prek update\` synced into the scaffold template."
          fi
